name: Deploy

# Every green CI run on main ships to the VPS. Manual runs redeploy the current main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      API_IMAGE: ghcr.io/nazariitsubera/the-crew-fund/api
      WEB_IMAGE: ghcr.io/nazariitsubera/the-crew-fund/web
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ env.SHA }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.crewfund.vodka
          tags: |
            ${{ env.WEB_IMAGE }}:${{ env.SHA }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Load the deploy key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Ship the compose files
        run: scp deploy/docker-compose.yml deploy/Caddyfile "$TARGET":/opt/crew/

      - name: Roll out
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The job token can pull our private images only while this job runs; log out after.
          printf '%s' "$GHCR_TOKEN" | ssh "$TARGET" "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          # Caddy reads its Caddyfile only at start, and the file is bind-mounted, so restart it.
          ssh "$TARGET" "cd /opt/crew && export API_TAG=$SHA WEB_TAG=$SHA && docker compose pull && docker compose up -d --remove-orphans && docker compose restart caddy; status=\$?; docker logout ghcr.io; docker image prune -f >/dev/null; exit \$status"

      - name: Health check
        run: |
          # The API must answer /health; the site must serve the Next.js app, not any 200.
          check() { curl -fsS "$1" | grep -q "$2"; }
          for target in "https://api.crewfund.vodka/health|\"ok\":true" "https://crewfund.vodka|/_next/static/"; do
            url=${target%%|*}; marker=${target#*|}; ok=0
            for i in $(seq 1 30); do
              if check "$url" "$marker"; then ok=1; break; fi
              sleep 5
            done
            if [ "$ok" != 1 ]; then echo "$url did not serve the app within 150 s" >&2; exit 1; fi
            echo "$url ok"
          done
