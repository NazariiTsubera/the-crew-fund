name: CI

on:
  push:
    branches: [main]
    # A docs-only push skips CI, and with it the deploy that follows a green CI run.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    # Tiger Data runs TimescaleDB; the store tests run against the same engine.
    services:
      timescale:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_PASSWORD: crew
          POSTGRES_DB: crew_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:crew@localhost:5432/crew_test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --python 3.12
      - run: uv run ruff check .
      - run: uv run pytest -q

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
