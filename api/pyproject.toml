[project]
name = "crew-api"
version = "0.1.0"
description = "THE CREW: the fund engine and the judged portfolio API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "polars>=1.0",
    "pandas>=2.2",
    # The organizers' dataset SDK, pinned to their commit. Never install it by name:
    # `statevector` on PyPI is an unrelated package.
    "statevector @ git+https://github.com/orkid-labs/utsa-investment-hackathon@3c137e7#subdirectory=sdk",
    "psycopg[binary]>=3.2",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored organizers' scorer: kept byte-identical, so not linted.
extend-exclude = ["tests/rubric"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
